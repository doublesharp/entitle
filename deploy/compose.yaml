name: entitle
services:
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      LOCAL_BILLING: "false"
      DATA_DIR: /data
      WORK_DIR: /data/work
      WEB_DIR: /app/web
      PORT: 3211
    volumes:
      - ${ENTITLE_DATA_DIR:?Set ENTITLE_DATA_DIR to an absolute persistent directory}:/data
    expose: ["3211"]
    networks:
      default:
        ipv4_address: 172.30.81.3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${ENTITLE_MEMORY_LIMIT:-768m}
  web:
    build:
      context: ..
      dockerfile: deploy/runtime.Dockerfile
    restart: unless-stopped
    environment:
      ENTITLE_API_UPSTREAM: app:3211
      ENTITLE_PUBLIC_HOST: ${ENTITLE_PUBLIC_HOST:?Set the hostname matching PUBLIC_ORIGIN}
      ENTITLE_PUBLIC_SCHEME: https
      ENTITLE_TRUSTED_PROXY_CIDRS: 172.30.81.2/32
    volumes:
      - ${ENTITLE_WEB_RELEASE_DIR:?Set an absolute activated frontend release directory}:/releases:ro
    tmpfs:
      - /runtime:uid=101,gid=101,mode=0700
      - /cache:uid=101,gid=101,mode=0700
    expose: ["8080"]
    networks:
      default:
        ipv4_address: 172.30.81.4
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
  proxy:
    image: caddy:2.11.2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your HTTPS service origin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${ENTITLE_DATA_DIR}/caddy-data:/data
      - ${ENTITLE_DATA_DIR}/caddy-config:/config
    networks:
      default:
        ipv4_address: 172.30.81.2
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.81.0/24
